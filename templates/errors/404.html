{% extends "base.html" %}

{% block title %}Page Not Found (404) - Dhofar University{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-exclamation-triangle fa-4x text-warning"></i>
    </div>
    <h1 class="display-5 fw-bold">404 - Page Not Found</h1>
    <p class="lead text-muted mb-4">The page or student record you are looking for does not exist or may have been moved.</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
            <i class="fas fa-home me-1"></i> Return to Dashboard
        </a>
        <a href="{{ url_for('main.students') }}" class="btn btn-outline-secondary">
            <i class="fas fa-users me-1"></i> View Students
        </a>
    </div>
</div>
{% endblock %}
