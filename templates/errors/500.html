{% extends "base.html" %}

{% block title %}Internal Server Error (500) - Dhofar University{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-tools fa-4x text-danger"></i>
    </div>
    <h1 class="display-5 fw-bold">500 - Internal Server Error</h1>
    <p class="lead text-muted mb-4">An unexpected error occurred while processing your request. Please try again later.</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
            <i class="fas fa-home me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
